# constructorai.luxeivan.ru — host-nginx перед Docker-контейнером web.
# Скопировать в /etc/nginx/sites-available/ и включить симлинком.
# После этого certbot --nginx сам добавит listen 443 и редирект с HTTP.

server {
    listen 80;
    listen [::]:80;
    server_name constructorai.luxeivan.ru;

    # Фото до 15 МБ + запас на multipart.
    client_max_body_size 20m;

    # SSE (/api/projects/:id/events) и долгие AI-запросы.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:8081;
    }
}
